<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meus Investimentos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f5f8;--sf:#fff;--tx:#0e1f3b;--mut:#5d6b82;--ln:#dde3ec;--ac:#2447d6;--act:#fff;--warn:#b86e00;--bad:#c0392b;--ok:#137a52;--hero:#0e1f3b;--herot:#f3f5f8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b1220;--sf:#131c2e;--tx:#e6ecf7;--mut:#8b99b3;--ln:#243049;--ac:#7b9bff;--act:#0b1220;--warn:#e8a33d;--bad:#ef7b6c;--ok:#4fcf98;--hero:#16223b;--herot:#e6ecf7}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0b1220;--sf:#131c2e;--tx:#e6ecf7;--mut:#8b99b3;--ln:#243049;--ac:#7b9bff;--act:#0b1220;--warn:#e8a33d;--bad:#ef7b6c;--ok:#4fcf98;--hero:#16223b;--herot:#e6ecf7}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3,.num{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-variant-numeric:tabular-nums}
#app{max-width:640px;margin:0 auto;padding:20px 16px 110px}
h1{font-size:28px;margin:8px 0 16px;letter-spacing:-.02em}
h3{font-size:17px;margin:0 0 8px}
.m{color:var(--mut);font-size:14px}
.hero{background:var(--hero);color:var(--herot);border-radius:20px;padding:20px;margin-bottom:20px}
.hero .m{color:inherit;opacity:.7}
.big{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:clamp(30px,9vw,44px);font-weight:700;letter-spacing:-.03em;line-height:1.1;margin:4px 0 14px;overflow-wrap:anywhere}
.seg{display:flex;height:10px;border-radius:6px;overflow:hidden;gap:2px}
.seg i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px}
.leg span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:6px}
.sec{border-top:1px solid var(--ln);padding:18px 0}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.warn{color:var(--warn);font-weight:600}.bad{color:var(--bad);font-weight:600}.ok{color:var(--ok);font-weight:600}
.bar{margin:8px 0}.bl{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.tr{height:6px;background:var(--ln);border-radius:4px;margin-top:4px}.tr i{display:block;height:100%;background:var(--ac);border-radius:4px}
input,select,textarea{width:100%;font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:4px 0 12px}
label{font-size:14px;color:var(--mut)}
textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:13px 18px;background:var(--ac);color:var(--act);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ac);border:1px solid var(--ln)}
.btn.sm{padding:8px 12px;font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:8px;padding-bottom:4px}
.chip{font:inherit;font-size:14px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:20px;padding:6px 14px;white-space:nowrap}
.chip.on{background:var(--ac);color:var(--act);border-color:var(--ac)}
.item{border-top:1px solid var(--ln);padding:16px 0}
.item .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.item b{font-size:17px}
.val{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;white-space:nowrap}
.tag{font-size:13px;font-weight:600}
.err{color:var(--bad);margin:0 0 10px;min-height:1em}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;background:var(--sf);border-top:1px solid var(--ln);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;max-width:200px;font:inherit;font-size:13px;border:0;background:transparent;color:var(--mut);padding:8px 4px;border-radius:12px}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--ac);font-weight:700}
.empty{text-align:center;padding:40px 10px}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<main id="app"></main>
<nav>
<button data-v="home" onclick="nav('home')"><span>📊</span>Resumo</button>
<button data-v="list" onclick="nav('list')"><span>📒</span>Investimentos</button>
<button data-v="form" onclick="nav('form')"><span>➕</span>Novo</button>
</nav>
<script>
const K='inv_mvp_v1',PAL=['#2447d6','#13a37f','#e0a21b','#d4533b','#8a5cd6','#3a9bc9'];
let data=[];try{data=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){data=[]}
if(!Array.isArray(data))data=[];
let view='home',editId=null,q='',fs='todos',delId=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const persist=()=>{try{localStorage.setItem(K,JSON.stringify(data))}catch(e){}};
const fmt=(v,c)=>new Intl.NumberFormat('pt-PT',{maximumFractionDigits:2}).format(v)+(c==='USD'?' US$':' Kz');
const fd=d=>d?d.split('-').reverse().join('/'):'—';
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const left=i=>Math.round((new Date(i.fim+'T00:00:00')-new Date(today()+'T00:00:00'))/864e5);
const st=i=>i.estado==='Resgatado'?'Resgatado':(i.fim&&left(i)<0?'Vencido':'Ativo');
const sum=l=>l.reduce((a,i)=>a+i.valor,0);
function nav(v){view=v;editId=null;delId=null;render();window.scrollTo(0,0)}
function when(i){const d=left(i);return d<0?'venceu há '+(-d)+' d':d===0?'vence hoje':'vence em '+d+' d'}

function bars(ti,l,k,t,c){const g={};l.forEach(i=>{const n=i[k]||'Sem indicação';g[n]=(g[n]||0)+i.valor});
return '<h3>'+ti+'</h3>'+Object.entries(g).sort((a,b)=>b[1]-a[1]).map(([n,v])=>'<div class="bar"><div class="bl"><span>'+esc(n)+'</span><span>'+fmt(v,c)+' ('+Math.round(v/t*100)+'%)</span></div><div class="tr"><i style="width:'+(v/t*100)+'%"></i></div></div>').join('')}

function home(){
const act=data.filter(i=>i.estado!=='Resgatado');
if(!data.length)return '<div class="empty"><h1>Começa o teu registo</h1><p class="m">Ainda não há investimentos. Adiciona o primeiro ou carrega exemplos para experimentar.</p><div class="btns" style="justify-content:center"><button class="btn" onclick="nav(\'form\')">Adicionar investimento</button><button class="btn ghost" onclick="demo()">Carregar exemplos</button></div></div>';
const curs=[...new Set(act.map(i=>i.moeda))];
const al=act.filter(i=>i.fim&&left(i)<=30).sort((a,b)=>left(a)-left(b));
let h='<h1>Resumo</h1>';
curs.forEach(c=>{const l=act.filter(i=>i.moeda===c),t=sum(l),g={};
l.forEach(i=>g[i.inst]=(g[i.inst]||0)+i.valor);
const ent=Object.entries(g).sort((a,b)=>b[1]-a[1]);
h+='<div class="hero"><div class="m">Total em aberto ('+(c==='USD'?'Dólar':'Kwanza')+')</div><div class="big">'+fmt(t,c)+'</div><div class="seg">'+ent.map(([n,v],x)=>'<i style="width:'+(v/t*100)+'%;background:'+PAL[x%6]+'"></i>').join('')+'</div><div class="leg">'+ent.map(([n,v],x)=>'<span style="--c:'+PAL[x%6]+'">'+esc(n)+' '+Math.round(v/t*100)+'%</span>').join('')+'</div></div>';
const ex=l.filter(i=>i.esp>0);
if(ex.length)h+='<div class="row"><span class="m">Ganho esperado</span><span class="ok">+'+fmt(ex.reduce((a,i)=>a+i.esp-i.valor,0),c)+'</span></div>';
h+='<div class="sec">'+bars('Por modalidade',l,'mod',t,c)+'</div><div class="sec">'+bars('Por finalidade',l,'fin',t,c)+'</div>'});
if(al.length)h+='<div class="sec"><h3>Alertas de vencimento</h3>'+al.map(i=>'<div class="row"><span>'+esc(i.inst)+', '+esc(i.mod)+'</span><span class="'+(left(i)<0?'bad':'warn')+'">'+when(i)+'</span></div>').join('')+'</div>';
const rs=data.filter(i=>i.estado==='Resgatado'&&i.rec>0);
if(rs.length){const cs=[...new Set(rs.map(i=>i.moeda))];h+='<div class="sec"><h3>Resultado dos resgatados</h3>'+cs.map(c=>{const r=rs.filter(i=>i.moeda===c).reduce((a,i)=>a+i.rec-i.valor,0);return '<div class="row"><span class="m">'+(c==='USD'?'Dólar':'Kwanza')+'</span><span class="'+(r>=0?'ok':'bad')+'">'+(r>=0?'+':'')+fmt(r,c)+'</span></div>'}).join('')+'</div>'}
return h}

function itemsHtml(){
const s=q.trim().toLowerCase();
const l=data.filter(i=>(fs==='todos'||st(i)===fs)&&(!s||[i.inst,i.mod,i.fin,i.nota].join(' ').toLowerCase().includes(s))).sort((a,b)=>(a.fim||'9').localeCompare(b.fim||'9'));
if(!l.length)return '<p class="m empty">Nenhum investimento encontrado.</p>';
return l.map(i=>{const s=st(i),cl=s==='Vencido'?'bad':s==='Resgatado'?'m':'ok';
return '<div class="item"><div class="top"><b>'+esc(i.inst)+'</b><span class="val">'+fmt(i.valor,i.moeda)+'</span></div>'+
'<div class="m">'+esc(i.mod)+(i.fin?' para '+esc(i.fin):'')+'</div>'+
'<div class="m">De '+fd(i.ini)+' até '+fd(i.fim)+'</div>'+
'<div><span class="tag '+cl+'">'+s+'</span>'+(s==='Ativo'&&i.fim&&left(i)<=30?' <span class="warn tag">'+when(i)+'</span>':'')+(i.esp>0?' <span class="m">Esperado: '+fmt(i.esp,i.moeda)+'</span>':'')+(i.rec>0?' <span class="m">Recebido: '+fmt(i.rec,i.moeda)+'</span>':'')+'</div>'+
(i.nota?'<div class="m">“'+esc(i.nota)+'”</div>':'')+
'<div class="btns"><button class="btn ghost sm" onclick="edit('+i.id+')">Editar</button><button class="btn ghost sm" onclick="del('+i.id+')">'+(delId===i.id?'Confirmar apagar':'Apagar')+'</button></div></div>'}).join('')}
const items=()=>{$('#items').innerHTML=itemsHtml()};
function list(){return '<h1>Investimentos</h1><input id="q" type="search" placeholder="Pesquisar por banco, modalidade, finalidade" value="'+esc(q)+'" oninput="q=this.value;items()"><div class="chips">'+['todos','Ativo','Vencido','Resgatado'].map(s=>'<button class="chip '+(fs===s?'on':'')+'" onclick="fs=\''+s+'\';render()">'+(s==='todos'?'Todos':s)+'</button>').join('')+'</div><div id="items">'+itemsHtml()+'</div>'}
function edit(id){editId=id;view='form';render();window.scrollTo(0,0)}
function del(id){if(delId===id){data=data.filter(i=>i.id!==id);delId=null;persist()}else delId=id;render()}

function form(){
const i=data.find(x=>x.id===editId)||{moeda:'AOA',estado:'Ativo',ini:today()};
const ins=[...new Set(data.map(x=>x.inst))],mods=[...new Set(['Depósito a prazo','Ações','Títulos do Tesouro','Fundo de investimento','Poupança','Cripto'].concat(data.map(x=>x.mod)))];
const v=(k)=>esc(i[k]==null?'':i[k]);
return '<h1>'+(editId?'Editar investimento':'Novo investimento')+'</h1>'+
'<label>Banco, corretora ou bolsa</label><input id="f_inst" list="dl_i" value="'+v('inst')+'" placeholder="Ex.: BAI, BODIVA, Trade Republic"><datalist id="dl_i">'+ins.map(x=>'<option value="'+esc(x)+'">').join('')+'</datalist>'+
'<div class="two"><div><label>Valor investido</label><input id="f_valor" type="number" inputmode="decimal" min="0" value="'+v('valor')+'"></div><div><label>Moeda</label><select id="f_moeda"><option value="AOA"'+(i.moeda==='AOA'?' selected':'')+'>Kwanza</option><option value="USD"'+(i.moeda==='USD'?' selected':'')+'>Dólar</option></select></div>'+
'<div><label>Data de início</label><input id="f_ini" type="date" value="'+v('ini')+'"></div><div><label>Data de fim</label><input id="f_fim" type="date" value="'+v('fim')+'"></div></div>'+
'<label>Modalidade</label><input id="f_mod" list="dl_m" value="'+v('mod')+'"><datalist id="dl_m">'+mods.map(x=>'<option value="'+esc(x)+'">').join('')+'</datalist>'+
'<label>Finalidade</label><input id="f_fin" value="'+v('fin')+'" placeholder="Ex.: propinas, carro, reserva de emergência">'+
'<div class="two"><div><label>Valor esperado no fim</label><input id="f_esp" type="number" inputmode="decimal" min="0" value="'+v('esp')+'"></div><div><label>Valor recebido</label><input id="f_rec" type="number" inputmode="decimal" min="0" value="'+v('rec')+'"></div></div>'+
'<label>Estado</label><select id="f_estado"><option'+(i.estado==='Ativo'?' selected':'')+'>Ativo</option><option'+(i.estado==='Resgatado'?' selected':'')+'>Resgatado</option></select>'+
'<label>Notas</label><textarea id="f_nota">'+v('nota')+'</textarea><p class="err" id="err"></p>'+
'<div class="btns"><button class="btn" onclick="submitF()">Guardar investimento</button><button class="btn ghost" onclick="nav(\'list\')">Cancelar</button></div>'}
function submitF(){
const g=k=>$('#f_'+k).value.trim(),o={inst:g('inst'),valor:parseFloat(g('valor')),moeda:g('moeda'),ini:g('ini'),fim:g('fim'),mod:g('mod'),fin:g('fin'),esp:parseFloat(g('esp'))||0,rec:parseFloat(g('rec'))||0,estado:g('estado'),nota:g('nota')};
const e=!o.inst?'Indica o banco, corretora ou bolsa.':!(o.valor>0)?'Indica um valor investido maior que zero.':!o.ini?'Indica a data de início.':!o.fim?'Indica a data de fim.':o.fim<o.ini?'A data de fim não pode ser antes da data de início.':!o.mod?'Indica a modalidade.':'';
if(e){$('#err').textContent=e;return}
if(editId){const x=data.find(i=>i.id===editId);Object.assign(x,o)}else{o.id=Date.now();data.push(o)}
persist();editId=null;view='list';render();window.scrollTo(0,0)}
function demo(){const d=n=>{const x=new Date();x.setDate(x.getDate()+n);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
data=data.concat([
{id:1,inst:'BAI',valor:500000,moeda:'AOA',ini:d(-150),fim:d(12),mod:'Depósito a prazo',fin:'Propinas',esp:560000,rec:0,estado:'Ativo',nota:'Renovar se a taxa subir'},
{id:2,inst:'BODIVA',valor:300000,moeda:'AOA',ini:d(-60),fim:d(200),mod:'Títulos do Tesouro',fin:'Reserva de emergência',esp:345000,rec:0,estado:'Ativo',nota:''},
{id:3,inst:'Trade Republic',valor:400,moeda:'USD',ini:d(-90),fim:d(300),mod:'Ações',fin:'Carro',esp:0,rec:0,estado:'Ativo',nota:''},
{id:4,inst:'BFA',valor:200000,moeda:'AOA',ini:d(-300),fim:d(-5),mod:'Poupança',fin:'Telemóvel novo',esp:0,rec:0,estado:'Ativo',nota:''},
{id:5,inst:'BAI',valor:100000,moeda:'AOA',ini:d(-400),fim:d(-40),mod:'Depósito a prazo',fin:'Viagem',esp:0,rec:112000,estado:'Resgatado',nota:''}]);
persist();render()}
function render(){
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
$('#app').innerHTML=view==='home'?home():view==='list'?list():form()}
render();
</script>
</body>
</html>
